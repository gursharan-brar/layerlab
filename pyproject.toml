[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "layerlab"
version = "0.1.0"
description = "Split a video into dialogue, music, sound effects, on-screen graphics and an edit timeline. Runs locally."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
keywords = ["video", "audio", "stem-separation", "editing", "local", "ffmpeg"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "platformdirs>=4.0",
    "rich>=13.7",
    "tomli>=2.0; python_version < '3.11'",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.0",
    "ruff>=0.8",
    # Installed on every Python so mypy can check the Python 3.10 import branch.
    "tomli>=2.0",
]

[project.scripts]
layerlab = "layerlab.cli:app"

[tool.hatch.build]
# Model weights are downloaded at runtime and must never ship in the sdist or wheel.
exclude = [
    "*.safetensors",
    "*.onnx",
    "*.gguf",
    "*.ggml",
    "*.bin",
    "*.pt",
    "*.pth",
    "*.ckpt",
    "*.th",
    "*.tflite",
    "*.h5",
    "*.part",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares its options as default arguments by design.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
files = ["src/layerlab", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
