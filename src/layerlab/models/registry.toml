sha256 = "a4a068cd6cf1ea8355b84327595838ca748ec29a25bc91fc82e6c299ccdc5808"
size = 2243022
license = "MIT"
commercial_use = true
homepage = "https://huggingface.co/onnx-community/silero-vad"

