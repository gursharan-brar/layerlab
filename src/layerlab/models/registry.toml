# layerlab model registry.
#
# Each [[models]] entry is a single weight file that layerlab downloads on first
# use into the user cache directory and verifies against `sha256`. Weights are
# never stored in this repository or in the layerlab package.
#
# Fields:
#   name            unique id used by `layerlab models fetch <name>`
#   task            separation, dialogue, music, sfx, graphics, timeline or inpaint
#   description     one line
#   url             direct download URL, pinned to an immutable revision
#   sha256          hex SHA-256 of the file
#   size            size in bytes
#   license         SPDX identifier, or NOASSERTION when the publisher states none
#   commercial_use  true only if the license clearly allows commercial use
#   homepage        model card or source page where the license is stated
#
# Licenses are recorded as stated by the publisher. Check them yourself before use.
# Prefer formats that do not execute code on load (ONNX, safetensors, GGML/GGUF).

# Default audio backend. Int8-weight ONNX export of JusperLee/TIGER-DnR
# (revision b7a59560bbca10febbcd46fb01600f868e587f57), Apache-2.0.
[[models]]
name = "tiger-dnr-int8"
task = "separation"
description = "TIGER-DnR dialogue/music/effects separation, int8 weights (ONNX)"
url = "https://huggingface.co/audiojs/tiger-dnr/resolve/65072a210374cac07ea2ac30a85a4a0b7c71a652/tiger.int8.onnx"
sha256 = "2189859ac7e89cf4d9d284c6f393e737aaa2b3233ed7ee424ad622012bce7bca"
size = 7320735
license = "Apache-2.0"
commercial_use = true
homepage = "https://huggingface.co/audiojs/tiger-dnr"

# Optional demucs backend: htdemucs_ft, one fine-tuned model per source. PyTorch
# pickles, loaded only after the SHA-256 check. The first 8 hex digits of each
# hash match the checksum in Demucs's own file name.
